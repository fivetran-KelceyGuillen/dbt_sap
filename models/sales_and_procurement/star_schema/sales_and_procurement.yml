metrics:
  - name: purchase_to_sales_value_ratio
    description: Monto de órdenes de compra como proporción del valor neto de ventas -- una vista cruzada entre gasto e ingresos
    type: ratio
    label: Relación Compras/Ventas
    numerator: purchase_order_amount_total
    denominator: sales_net_value_total
  - name: gross_margin_proxy_amount
    description: Diferencia absoluta aproximada entre el valor neto de ventas y el monto de órdenes de compra -- un proxy de margen entre modelos, no es una cifra contable (GAAP)
    type: derived
    label: Monto Proxy de Margen Bruto
    expr: revenue - spend
    input_metrics:
      - name: sales_net_value_total
        alias: revenue
      - name: purchase_order_amount_total
        alias: spend
  - name: billing_to_sales_value_ratio
    description: Valor neto de facturación como proporción del valor neto de ventas -- mide qué parte de lo vendido ya fue facturado
    type: ratio
    label: Relación Facturación/Ventas
    numerator: billing_net_value_total
    denominator: sales_net_value_total
  - name: sales_net_value_unbilled_amount
    description: Diferencia aproximada entre el valor neto de ventas y el valor neto de facturación -- monto vendido aún no facturado
    type: derived
    label: Monto de Ventas Sin Facturar
    expr: sold - billed
    input_metrics:
      - name: sales_net_value_total
        alias: sold
      - name: billing_net_value_total
        alias: billed
  - name: delivery_to_sales_value_ratio
    description: Valor neto de entregas como proporción del valor neto de ventas -- mide qué parte de lo vendido ya fue despachado
    type: ratio
    label: Relación Entregas/Ventas
    numerator: delivery_net_value_total
    denominator: sales_net_value_total
  - name: sales_net_value_undelivered_amount
    description: Diferencia aproximada entre el valor neto de ventas y el valor neto de entregas -- monto vendido aún no despachado
    type: derived
    label: Monto de Ventas Sin Entregar
    expr: sold - delivered
    input_metrics:
      - name: sales_net_value_total
        alias: sold
      - name: delivery_net_value_total
        alias: delivered

