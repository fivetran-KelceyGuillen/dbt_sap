version: 2
models:
  - name: sap__dim_customer
    description: Tabla de dimensión de clientes
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - customer_id
    semantic_model:
      enabled: true
      name: dim_customer

    derived_semantics:
      entities:
        - name: customer
          type: primary
          expr: "concat(client_id, '-', customer_id)"
          label: Cliente

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el registro del cliente
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: customer_number
        description: Identificador único del cliente en SAP
        dimension:
          type: categorical
      - name: country_key_id
        description: Clave de país asociada al cliente
        dimension:
          type: categorical
      - name: customer_name
        description: Nombre completo del cliente
        dimension:
          type: categorical
      - name: city
        description: Ciudad de residencia del cliente
        dimension:
          type: categorical
      - name: customer_id
        description: Clave subrogada del cliente
        data_tests:
          - not_null

  - name: sap__dim_customer_sales_area
    description: Atributos de área de ventas del cliente (grano cliente / organización de ventas / canal de distribución / división), construido a partir de KNVV. Un cliente puede tener varias filas de área de ventas.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - customer_id
              - sales_organization_id
              - distribution_channel_id
              - division_id
    semantic_model:
      enabled: true
      name: dim_customer_sales_area

    derived_semantics:
      entities:
        - name: customer_sales_area
          type: primary
          expr: "concat(client_id, '-', customer_id, '-', sales_organization_id, '-', distribution_channel_id, '-', division_id)"
          label: Área de Ventas del Cliente
        - name: customer
          type: foreign
          expr: "concat(client_id, '-', customer_id)"
          label: Cliente

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el registro de área de ventas
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: customer_id
        description: Cliente al que pertenece este registro de área de ventas
        data_tests:
          - not_null
      - name: customer_number
        description: Identificador único del cliente en SAP
        dimension:
          type: categorical
      - name: sales_organization_id
        description: Organización de ventas
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: distribution_channel_id
        description: Canal de distribución
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: division_id
        description: División
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: customer_group_id
        description: Grupo de cliente
        dimension:
          type: categorical
      - name: sales_district_id
        description: Zona de ventas
        dimension:
          type: categorical
      - name: sales_office_id
        description: Oficina de ventas
        dimension:
          type: categorical
      - name: sales_group_id
        description: Grupo de ventas
        dimension:
          type: categorical
      - name: currency_id
        description: Moneda utilizada en esta área de ventas del cliente
        dimension:
          type: categorical
      - name: payment_terms_id
        description: Condiciones de pago para esta área de ventas del cliente
        dimension:
          type: categorical
      - name: max_partial_deliveries
        description: Cantidad máxima de entregas parciales permitidas
      - name: complete_delivery
        description: Indicador de entrega completa
        dimension:
          type: categorical
      - name: delivery_block_id
        description: Motivo de bloqueo de entrega para esta área de ventas del cliente
        dimension:
          type: categorical
      - name: billing_block_id
        description: Motivo de bloqueo de facturación para esta área de ventas del cliente
        dimension:
          type: categorical
      - name: deletion_flag
        description: Marca de eliminación para este registro de área de ventas del cliente
        dimension:
          type: categorical


  - name: sap__dim_material
    description: Tabla de dimensión de materiales
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - material_id
    semantic_model:
      enabled: true
      name: dim_material

    derived_semantics:
      entities:
        - name: material
          type: primary
          expr: "concat(client_id, '-', material_id)"
          label: Material
    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el registro del material
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: material_number
        description: Identificador único del material
        dimension:
          type: categorical
      - name: material_description
        description: Descripción textual del material
        dimension:
          type: categorical
      - name: material_type_id
        description: Identificador del tipo de material (ej. producto terminado)
        dimension:
          type: categorical
      - name: material_type_description
        description: Descripción del tipo de material
        dimension:
          type: categorical
      - name: base_uom_id
        description: Unidad de medida base del material
        dimension:
          type: categorical
      - name: gross_weight
        description: Peso bruto del material
      - name: weight_uom_id
        description: Unidad de medida del peso
        dimension:
          type: categorical
      - name: material_id
        description: Clave subrogada del material
        data_tests:
          - not_null

  - name: sap__dim_plant
    description: Tabla de dimensión de plantas/sucursales
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - plant_id
    semantic_model:
      enabled: true
      name: dim_plant

    derived_semantics:
      entities:
        - name: plant
          type: primary
          expr: "concat(client_id, '-', plant_id)"
          label: Planta

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el registro de la planta
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: plant_id
        description: Identificador único de la planta
        data_tests:
          - not_null
      - name: plant_name
        description: Nombre de la planta
        dimension:
          type: categorical
      - name: country_key_id
        description: Clave de país
        dimension:
          type: categorical

  - name: sap__dim_purchasing_order
    description: Atributos de cabecera del documento de compras
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - purchasing_document_id
    semantic_model:
      enabled: true
      name: dim_purchasing_order

    derived_semantics:
      entities:
        - name: purchasing_document
          type: primary
          expr: "concat(client_id, '-', purchasing_document_id)"
          label: Documento de Compra
        - name: company
          type: foreign
          expr: "concat(client_id, '-', company_code_id)"
          label: Código de Sociedad

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el documento de compras
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: purchasing_document_id
        description: ID único del documento de compras
        data_tests:
          - not_null
      - name: purchasing_document_category
        description: Código de categoría del documento de compras
        dimension:
          type: categorical
      - name: purchasing_document_category_txt
        description: Descripción de la categoría del documento
        dimension:
          type: categorical
      - name: purchasing_document_type_id
        description: Código de tipo de documento (ej. NB, FO)
        dimension:
          type: categorical
      - name: purchasing_document_type_text
        description: Descripción del tipo de documento de compras
        dimension:
          type: categorical
      - name: purchasing_group_id
        description: ID del grupo de compras
        dimension:
          type: categorical
      - name: description_purchasing_group
        description: Descripción del grupo de compras
        dimension:
          type: categorical
      - name: purchasing_document_status
        description: Código de estado del documento de compras
        dimension:
          type: categorical
      - name: purchasing_document_status_txt
        description: Descripción del estado del documento
        dimension:
          type: categorical
      - name: payment_terms
        description: Clave de condiciones de pago
        dimension:
          type: categorical
      - name: reason_cancellation_id
        description: Código del motivo de cancelación
        dimension:
          type: categorical
      - name: company_code_id
        description: Sociedad asociada al documento

  - name: sap__dim_purchasing_organization
    description: Dimensión de organización de compras
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - company_code_id
              - purchasing_organization_id
    semantic_model:
      enabled: true
      name: dim_purchasing_organization

    derived_semantics:
      entities:
        - name: purchasing_organization
          type: primary
          expr: "concat(client_id, '-', company_code_id, '-', purchasing_organization_id)"
          label: Organización de Compras
        - name: company
          type: foreign
          expr: "concat(client_id, '-', company_code_id)"
          label: Código de Sociedad

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece la organización de compras
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: company_code_id
        description: Sociedad asignada a la organización
        data_tests:
          - not_null
      - name: purchasing_organization_id
        description: ID de la organización de compras
        data_tests:
          - not_null
      - name: description
        description: Descripción de la organización de compras
        dimension:
          type: categorical

  - name: sap__dim_rejection_reason
    description: Motivos de rechazo de documentos de compra/venta
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - reason_rejection_id
    semantic_model:
      enabled: true
      name: dim_rejection_reason

    derived_semantics:
      entities:
        - name: rejection_reason
          type: primary
          expr: "concat(client_id, '-', reason_rejection_id)"
          label: Motivo de Rechazo

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el motivo de rechazo
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: reason_rejection_id
        description: Código del motivo de rechazo
        data_tests:
          - not_null
      - name: rejection_reason_description
        description: Descripción del motivo de rechazo
        dimension:
          type: categorical

  - name: sap__dim_vendor
    description: Tabla de dimensión de proveedores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - vendor_id
    semantic_model:
      enabled: true
      name: dim_vendor

    derived_semantics:
      entities:
        - name: vendor
          type: primary
          expr: "concat(client_id, '-', vendor_id)"
          label: Proveedor

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el registro del proveedor
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: vendor_id
        description: ID del proveedor
        data_tests:
          - not_null
      - name: country_key_id
        description: Clave de país del proveedor
        dimension:
          type: categorical
      - name: name
        description: Nombre del proveedor (línea 1)
        dimension:
          type: categorical
      - name: name_2
        description: Nombre del proveedor (línea 2)
        dimension:
          type: categorical
      - name: city
        description: Ciudad del proveedor
        dimension:
          type: categorical
      - name: sort_field
        description: Campo de ordenamiento del proveedor
        dimension:
          type: categorical
      - name: authorization_group_id
        description: ID del grupo de autorización
        dimension:
          type: categorical
      - name: industry_key_id
        description: Clave de clasificación de industria
        dimension:
          type: categorical
      - name: group_key
        description: Clave de agrupación de proveedores
        dimension:
          type: categorical
      - name: vendor_account_group_id
        description: ID del grupo de cuentas del proveedor
        dimension:
          type: categorical

  - name: sap__fact_purchasing_order
    description: Métricas a nivel de línea para documentos de compras
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - purchasing_document_id
              - purchasing_document_item_id
    semantic_model:
      enabled: true
      name: fact_purchasing_order

    agg_time_dimension: purchasing_document_date
    derived_semantics:
      entities:
        - name: purchasing_order_line
          type: primary
          expr: "concat(client_id, '-', purchasing_document_id, '-', purchasing_document_item_id)"
          label: Línea de Orden de Compra
        - name: purchasing_document
          type: foreign
          expr: "concat(client_id, '-', purchasing_document_id)"
          label: Documento de Compra
        - name: material
          type: foreign
          expr: "concat(client_id, '-', material_id)"
          label: Material
        - name: plant
          type: foreign
          expr: "concat(client_id, '-', plant_id)"
          label: Planta
        - name: vendor
          type: foreign
          expr: "concat(client_id, '-', vendor_id)"
          label: Proveedor
        - name: purchasing_organization
          type: foreign
          expr: "concat(client_id, '-', company_code_id, '-', purchasing_organization_id)"
          label: Organización de Compras
        - name: company
          type: foreign
          expr: "concat(client_id, '-', company_code_id)"
          label: Código de Sociedad

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el documento de compras
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: purchasing_document_id
        description: ID del documento de compras
        data_tests:
          - not_null
      - name: purchasing_document_item_id
        description: Número de ítem en el documento de compras
        data_tests:
          - not_null
      - name: company_code_id
        description: Sociedad que creó la orden
      - name: currency_id
        description: Moneda utilizada en la transacción
        dimension:
          type: categorical
      - name: material_id
        description: Clave foránea al maestro de materiales
      - name: plant_id
        description: Planta donde se entregan los bienes
      - name: purchasing_group_id
        description: Grupo de compras responsable
        dimension:
          type: categorical
      - name: purchasing_organization_id
        description: Organización de compras responsable
      - name: vendor_id
        description: Proveedor que suministra los bienes
      - name: order_uom_id
        description: Unidad de medida de la orden
        dimension:
          type: categorical
      - name: purchasing_document_date
        description: Fecha de creación del documento de compras
        granularity: day
        dimension:
          type: time
      - name: scheduled_delivery_date
        description: Fecha planificada de entrega
        granularity: day
        dimension:
          type: time
      - name: purchase_deliver_late_days
        description: Días de atraso en la entrega
      - name: purchase_late_lead_days
        description: Días excedidos respecto del lead time
      - name: purchase_order_quantity
        description: Cantidad pedida
      - name: purchase_open_quantity
        description: Cantidad pendiente de entregar
      - name: purchasing_delivered_quantity
        description: Cantidad entregada
      - name: purchase_late_quantity
        description: Cantidad entregada tarde
      - name: cancel_purchase_quantity
        description: Cantidad cancelada
      - name: purchase_order_amount
        description: Valor total de la orden
      - name: purchasing_document_currency_amount
        description: Valor de la orden en la moneda del documento
      - name: document_currency_id
        description: Código de moneda de la orden
        dimension:
          type: categorical
      - name: purchase_open_amount
        description: Valor de la cantidad sin entregar
      - name: purchase_delivered_amount
        description: Valor de la cantidad entregada
      - name: cancel_purchase_amount
        description: Valor de la cantidad cancelada
      - name: purchase_late_amount
        description: Valor de la cantidad entregada tarde
      - name: purchase_invoiced_amount
        description: Monto facturado
      - name: purchase_order_item_count
        description: Cantidad de líneas de ítem en la orden
      - name: purchase_item_late_count
        description: Cantidad de ítems entregados tarde
      - name: purchase_item_open_count
        description: Cantidad de ítems abiertos (sin entregar)
      - name: purchase_item_closed_count
        description: Cantidad de ítems cerrados/completados
      - name: returns_item
        description: Indica si el ítem es una devolución ('' si no lo es)
        dimension:
          type: categorical
      - name: rejection_indicator
        description: Indicador de si el ítem fue rechazado
        dimension:
          type: categorical
      - name: exchange_rate
        description: Tipo de cambio entre la moneda del documento y la moneda local
      - name: latest_goods_receive_date
        description: Fecha de la recepción de mercancía más reciente registrada
        granularity: day
        dimension:
          type: time
      - name: delivery_completed
        description: Indicador de si la entrega del ítem está completa
        dimension:
          type: categorical
    metrics:
      - name: purchase_order_quantity_total
        description: Cantidad total pedida en órdenes de compra
        type: simple
        label: Cantidad Pedida en Compras
        agg: sum
        expr: purchase_order_quantity

      - name: purchase_order_amount_total
        description: Monto total pedido en órdenes de compra
        type: simple
        label: Monto Pedido en Compras
        agg: sum
        expr: purchase_order_amount
      - name: purchase_delivered_quantity_total
        description: Cantidad total entregada por el proveedor contra las órdenes de compra
        type: simple
        label: Cantidad Entregada en Compras
        agg: sum
        expr: purchasing_delivered_quantity
      - name: purchase_delivered_amount_total
        description: Valor total de lo efectivamente entregado contra las órdenes de compra
        type: simple
        label: Monto Entregado en Compras
        agg: sum
        expr: purchase_delivered_amount
      - name: purchase_open_quantity_total
        description: Cantidad total pedida que todavía no fue entregada
        type: simple
        label: Cantidad Abierta en Compras
        agg: sum
        expr: purchase_open_quantity
      - name: purchase_open_amount_total
        description: Valor total de la cantidad pedida que todavía no fue entregada
        type: simple
        label: Monto Abierto en Compras
        agg: sum
        expr: purchase_open_amount
      - name: purchase_late_quantity_total
        description: Cantidad total entregada después de la fecha de entrega programada
        type: simple
        label: Cantidad Entregada Tarde
        agg: sum
        expr: purchase_late_quantity
      - name: purchase_late_amount_total
        description: Valor total de la cantidad entregada después de la fecha de entrega programada
        type: simple
        label: Monto Entregado Tarde
        agg: sum
        expr: purchase_late_amount
      - name: purchase_cancelled_quantity_total
        description: Cantidad total cancelada en órdenes de compra
        type: simple
        label: Cantidad Cancelada en Compras
        agg: sum
        expr: cancel_purchase_quantity
      - name: purchase_cancelled_amount_total
        description: Valor total cancelado en órdenes de compra
        type: simple
        label: Monto Cancelado en Compras
        agg: sum
        expr: cancel_purchase_amount
      - name: purchase_invoiced_amount_total
        description: Monto total facturado por el proveedor contra las órdenes de compra
        type: simple
        label: Monto Facturado en Compras
        agg: sum
        expr: purchase_invoiced_amount
      - name: purchase_order_line_count
        description: Cantidad de líneas de orden de compra
        type: simple
        label: Cantidad de Líneas de Orden de Compra
        agg: count
        expr: "1"
      - name: purchase_late_item_count
        description: Cantidad de ítems de orden de compra entregados después de la fecha programada
        type: simple
        label: Cantidad de Ítems Entregados Tarde
        agg: sum
        expr: purchase_item_late_count
      - name: purchase_open_item_count
        description: Cantidad de ítems de orden de compra todavía sin entregar
        type: simple
        label: Cantidad de Ítems Abiertos
        agg: sum
        expr: purchase_item_open_count
      - name: purchase_closed_item_count
        description: Cantidad de ítems de orden de compra completamente entregados
        type: simple
        label: Cantidad de Ítems Cerrados
        agg: sum
        expr: purchase_item_closed_count
      - name: purchase_deliver_late_days_average
        description: Promedio de días de atraso entre la fecha programada y la fecha real de recepción de mercancía
        type: simple
        label: Promedio de Días de Atraso en Entrega
        agg: average
        expr: purchase_deliver_late_days

      - name: purchase_late_delivery_rate
        description: Proporción de líneas de orden de compra que se entregaron tarde
        type: ratio
        label: Tasa de Entrega Tardía en Compras
        numerator: purchase_late_item_count
        denominator: purchase_order_line_count
      - name: purchase_cancellation_rate
        description: Proporción del valor pedido que fue cancelado posteriormente
        type: ratio
        label: Tasa de Cancelación en Compras
        numerator: purchase_cancelled_amount_total
        denominator: purchase_order_amount_total
      - name: purchase_order_amount_cumulative
        description: Total acumulado del monto de órdenes de compra a lo largo de todo el período
        type: cumulative
        label: Monto Acumulado de Órdenes de Compra (Histórico)
        input_metric: purchase_order_amount_total
      - name: purchase_order_amount_mtd
        description: Monto acumulado de órdenes de compra desde el inicio del mes
        type: cumulative
        label: Monto de Órdenes de Compra (Acum. del Mes)
        grain_to_date: month
        input_metric: purchase_order_amount_total
      - name: purchase_order_amount_l30d
        description: Monto de órdenes de compra en una ventana móvil de 30 días
        type: cumulative
        label: Monto de Órdenes de Compra (Últimos 30 Días)
        window: 30 days
        input_metric: purchase_order_amount_total
      - name: purchase_order_amount_growth_mom
        description: Crecimiento porcentual del monto de órdenes de compra respecto al mes anterior
        type: derived
        label: Crecimiento % del Monto de Compras M/M
        expr: (current_month - prior_month) * 100 / nullif(prior_month, 0)
        input_metrics:
          - name: purchase_order_amount_total
            alias: current_month
          - name: purchase_order_amount_total
            alias: prior_month
            offset_window: 1 month
      - name: purchase_order_amount_growth_yoy
        description: Crecimiento porcentual del monto de órdenes de compra respecto al mismo período del año anterior
        type: derived
        label: Crecimiento % del Monto de Compras A/A
        expr: (current_year - prior_year) * 100 / nullif(prior_year, 0)
        input_metrics:
          - name: purchase_order_amount_total
            alias: current_year
          - name: purchase_order_amount_total
            alias: prior_year
            offset_window: 1 year
      - name: purchase_order_average_value
        description: Monto promedio de la orden de compra por línea de pedido
        type: ratio
        label: Valor Promedio de Orden de Compra
        numerator: purchase_order_amount_total
        denominator: purchase_order_line_count
      - name: purchase_fulfillment_rate
        description: Proporción del valor pedido que efectivamente fue entregado
        type: ratio
        label: Tasa de Cumplimiento de Compras
        numerator: purchase_delivered_amount_total
        denominator: purchase_order_amount_total
      - name: purchase_net_order_value
        description: Monto de la orden de compra neto de cancelaciones
        type: derived
        label: Valor Neto de la Orden de Compra
        expr: ordered - cancelled
        input_metrics:
          - name: purchase_order_amount_total
            alias: ordered
          - name: purchase_cancelled_amount_total
            alias: cancelled



  - name: sap__fact_sales_order
    description: Hechos y métricas a nivel de línea de orden de venta
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - sales_document_number
              - sales_document_item
    semantic_model:
      enabled: true
      name: fact_sales_order

    agg_time_dimension: document_date
    derived_semantics:
      entities:
        - name: sales_order_line
          type: primary
          expr: "concat(client_id, '-', sales_document_id, '-', sales_document_item)"
          label: Línea de Orden de Venta
        - name: customer
          type: foreign
          expr: "concat(client_id, '-', sold_to_customer_id)"
          label: Cliente
        - name: material
          type: foreign
          expr: "concat(client_id, '-', material_id)"
          label: Material
        - name: plant
          type: foreign
          expr: "concat(client_id, '-', plant_id)"
          label: Planta

    columns:
      - name: client_id
        description: Mandante SAP (mandt) al que pertenece el documento de venta
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: sales_document_number
        description: Número del documento de venta
        data_tests:
          - not_null
      - name: sales_document_item
        description: Número de ítem del documento de venta
        data_tests:
          - not_null
      - name: sd_document_category
        description: Categoría del documento de venta (ej. orden, cotización). SAP expone esto como un código de una letra en mayúscula (C = orden, H = nota de crédito por devolución).
        data_tests:
          - accepted_values:
              arguments:
                values: ['C', 'H']
        dimension:
          type: categorical

      - name: sales_document_type_id
        description: Tipo de documento de venta
        dimension:
          type: categorical
      - name: order_reason_id
        description: Código del motivo de la orden de venta
        dimension:
          type: categorical
      - name: delivery_block_id
        description: Código del motivo de bloqueo de entrega
        dimension:
          type: categorical
      - name: sales_organization_id
        description: Organización de ventas responsable de la venta
        dimension:
          type: categorical
      - name: distribution_channel_id
        description: Canal de distribución (ej. online, retail)
        dimension:
          type: categorical
      - name: division_id
        description: División del producto
        dimension:
          type: categorical
      - name: plant_id
        description: Planta que cumple la orden
      - name: document_date
        description: Fecha en que se creó el documento de venta
        granularity: day
        dimension:
          type: time
      - name: requested_delivery_date
        description: Fecha de entrega solicitada
        granularity: day
        dimension:
          type: time
      - name: sold_to_customer_id
        description: Cliente que realiza la orden
      - name: sales_document_id
        description: ID único del documento de venta
      - name: material_id
        description: ID del material o producto vendido
      - name: material_group_id
        description: Agrupación de materiales similares
        dimension:
          type: categorical
      - name: sales_document_item_category_id
        description: Categoría del ítem de venta (ej. estándar, servicio)
        dimension:
          type: categorical
      - name: product_hierarchy_id
        description: Clasificación de jerarquía de producto
        dimension:
          type: categorical
      - name: base_uom_id
        description: Unidad de medida base del material
        dimension:
          type: categorical
      - name: order_quantity
        description: Cantidad pedida
      - name: sales_uom_id
        description: Unidad de medida de ventas
        dimension:
          type: categorical
      - name: net_value
        description: Valor neto del ítem de la orden de venta
      - name: net_price
        description: Precio neto por unidad
      - name: sd_document_currency_id
        description: Moneda del documento de venta
        dimension:
          type: categorical
      - name: gross_weight
        description: Peso bruto del ítem
      - name: weight_uom_id
        description: Unidad de medida del peso
        dimension:
          type: categorical
      - name: created_date
        description: Fecha en que se creó la orden
        granularity: day
        dimension:
          type: time
      - name: returns_item
        description: Indica si este es un ítem de devolución
        dimension:
          type: categorical
      - name: reason_rejection_id
        description: Motivo de rechazo del ítem
        dimension:
          type: categorical
      - name: delivery_status
        description: Estado de entrega del ítem
        dimension:
          type: categorical
      - name: overall_status
        description: Estado general de la orden de venta
        dimension:
          type: categorical
      - name: item_delivery_status
        description: Estado de entrega a nivel de ítem
        dimension:
          type: categorical
      - name: created_by
        description: Usuario que creó el documento de venta
        dimension:
          type: categorical
      - name: _fivetran_deleted
        description: Marca de eliminación de Fivetran
      - name: _fivetran_synced
        description: Marca de tiempo de sincronización de Fivetran
    metrics:

      - name: sales_order_quantity_total
        description: Cantidad total pedida en órdenes de venta
        type: simple
        label: Cantidad Pedida en Ventas
        agg: sum
        expr: order_quantity
      - name: sales_net_value_total
        description: Valor neto total de las órdenes de venta
        type: simple
        label: Valor Neto de Ventas
        agg: sum
        expr: net_value
      - name: sales_net_price_average
        description: Precio neto promedio por unidad vendida, sin ponderar por cantidad
        type: simple
        label: Precio Neto Promedio de Ventas
        agg: average
        expr: net_price
      - name: sales_gross_weight_total
        description: Peso bruto total de los ítems vendidos
        type: simple
        label: Peso Bruto de Ventas
        agg: sum
        expr: gross_weight
      - name: sales_order_line_count
        description: Cantidad de líneas de orden de venta
        type: simple
        label: Cantidad de Líneas de Orden de Venta
        agg: count
        expr: "1"

      - name: sales_net_value_per_unit
        description: Valor neto de ventas por unidad vendida (precio promedio ponderado por cantidad, a diferencia de sales_net_price_average que no está ponderado)
        type: ratio
        label: Valor Neto de Ventas por Unidad
        numerator: sales_net_value_total
        denominator: sales_order_quantity_total
      - name: sales_net_value_cumulative
        description: Total acumulado del valor neto de ventas a lo largo de todo el período
        type: cumulative
        label: Valor Neto de Ventas Acumulado (Histórico)
        input_metric: sales_net_value_total
      - name: sales_net_value_mtd
        description: Valor neto de ventas acumulado desde el inicio del mes
        type: cumulative
        label: Valor Neto de Ventas (Acum. del Mes)
        grain_to_date: month
        input_metric: sales_net_value_total
      - name: sales_net_value_l7d
        description: Valor neto de ventas en una ventana móvil de 7 días
        type: cumulative
        label: Valor Neto de Ventas (Últimos 7 Días)
        window: 7 days
        input_metric: sales_net_value_total
      - name: sales_net_value_growth_mom
        description: Crecimiento porcentual del valor neto de ventas respecto al mes anterior
        type: derived
        label: Crecimiento % del Valor Neto de Ventas M/M
        expr: (current_month - prior_month) * 100 / nullif(prior_month, 0)
        input_metrics:
          - name: sales_net_value_total
            alias: current_month
          - name: sales_net_value_total
            alias: prior_month
            offset_window: 1 month
      - name: sales_net_value_growth_yoy
        description: Crecimiento porcentual del valor neto de ventas respecto al mismo período del año anterior
        type: derived
        label: Crecimiento % del Valor Neto de Ventas A/A
        expr: (current_year - prior_year) * 100 / nullif(prior_year, 0)
        input_metrics:
          - name: sales_net_value_total
            alias: current_year
          - name: sales_net_value_total
            alias: prior_year
            offset_window: 1 year
      - name: sales_average_order_value
        description: Valor neto de ventas promedio por línea de orden
        type: ratio
        label: Valor Promedio de Orden de Venta
        numerator: sales_net_value_total
        denominator: sales_order_line_count
      - name: sales_returns_value_total
        description: Valor neto de ventas de las líneas marcadas como devolución
        type: simple
        label: Valor de Devoluciones de Ventas
        agg: sum
        expr: net_value
        filter: |
          {{ Dimension('sales_order_line__returns_item') }} != ''
      - name: sales_return_rate
        description: Valor de devoluciones como proporción del valor neto total de ventas
        type: ratio
        label: Tasa de Devolución de Ventas
        numerator: sales_returns_value_total
        denominator: sales_net_value_total


