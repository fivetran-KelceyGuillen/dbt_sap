config-version: 2
name: 'sap'
version: '0.7.0'
require-dbt-version: [">=1.3.0", "<3.0.0"]
models:
  sap:
    +materialized: view
    +schema: kel_dbt
    staging:
      +materialized: view
    extractor_reports:
      +schema: kel_dbt
      intermediate:
        +schema: kel_dbt
        +materialized: view
    sales_and_procurement:
      +schema: kel_dbt
      +materialized: view
      star_schema:
        +schema: kel_dbt
        +materialized: view
        intermediate:
          +schema: kel_dbt
          +materialized: view
    compatibility_views:
      +schema: kel_dbt
      +materialized: view



vars:
  sap_schema: "kel_gcs_sap_hana_db_sapabap1"
  prefix_table_name: ""

  # --- Source availability audit (confirmed via INFORMATION_SCHEMA.TABLES) ---
  # The following SAP tables are not synced by this connector yet. Disabling
  # them lets every model that depends on them -- directly or as an optional
  # enrichment join -- degrade gracefully (skip the join, or disable itself
  # entirely if the table is its sole source) instead of erroring with
  # "table not found". Re-enable (remove the override) once the corresponding
  # SAP module is connected in Fivetran.
  #
  # Re-validated against INFORMATION_SCHEMA.TABLES -- the following 16 tables
  # are now connected and have been re-enabled (removed from this list):
  # marc, mchb, mchp, faglflexa, faglflext, tj01, tka01, t000, t006,
  # t503, ska1, pa0000, pa0001, pa0007, pa0008, pa0031.
  sap_using_acdoca: false
  sap_using_matdoc: false
  sap_using_matdoc_extract: false
  sap_using_finsc_cmp_versnd: false
  sap_using_finsc_ledger_rep: false
  sap_using_finsc_ld_cmp: false
  sap_using_cosp_bak: false
  sap_using_bsak_bck: false
  # coep now exists in the warehouse but only has 97 of the ~115 columns
  # stg_sap__coep.sql expects (same pattern as prps: _fivetran_sap_archived
  # is missing, plus likely more). No current downstream consumer either --
  # everything that refs coep (compatibility_views coep/cosp/coss) also needs
  # acdoca, which is still disconnected. Leave off until acdoca connects and
  # that whole CO chain becomes worth a real column audit.
  sap_using_coep: false

  # prps now exists in the warehouse, but its real schema only has 123 of the
  # ~144 columns stg_sap__prps.sql expects (confirmed: vbeln_prps and others
  # are missing). It also has no current downstream consumer -- int_coep__
  # original is the only ref, and that chain stays disabled until acdoca is
  # connected too. Leaving this off until a dedicated column-by-column audit
  # is done (do that together with acdoca, when the CO chain becomes usable).
  sap_using_prps: false
  # sapsll_clsnr's source config uses a typo'd double-underscore var name
  # (sap_using__sapsll_clsnr) while its staging model checks the normal
  # single-underscore name -- set both so the source and model agree.
  sap_using__sapsll_clsnr: false
  sap_using_sapsll_clsnr: false


  sap_using_sapsll_maritc: false
  sap_using_sapsll_nosca: false
  sap_using_sapsll_tunos: false
  # t161t (purchasing document type texts) is not synced for this connector;
  # disabling it lets int_sap__purchasing_document_type / sap__dim_purchasing_order
  # degrade gracefully (purchasing_document_type_text = null) instead of erroring.
  sap_using_t161t: false

  # bsad_bck exists under a different identifier for this connector (bsad_bak,
  # not bsad_bck) -- point the source at the real table instead of disabling it.
  sap_bsad_bck_identifier: "bsad_bak"



  sap:
    acdoca: "{{ source('sap', 'acdoca') }}"
    bkpf: "{{ source('sap', 'bkpf') }}"

    bsad_bck: "{{ source('sap', 'bsad_bck') }}"
    bsak_bck: "{{ source('sap', 'bsak_bck') }}"
    bseg: "{{ source('sap', 'bseg') }}"
    coep: "{{ source('sap', 'coep') }}"
    dd07l: "{{ source('sap', 'dd07l') }}"
    dd07t: "{{ source('sap', 'dd07t') }}"
    ekko: "{{ source('sap', 'ekko') }}"
    ekbe: "{{ source('sap', 'ekbe') }}"
    eket: "{{ source('sap', 'eket') }}"
    ekpo: "{{ source('sap', 'ekpo') }}"
    faglflexa: "{{ source('sap', 'faglflexa') }}"
    faglflext: "{{ source('sap', 'faglflext') }}"
    finsc_cmp_versnd: "{{ source('sap', 'finsc_cmp_versnd') }}"
    finsc_ledger_rep: "{{ source('sap', 'finsc_ledger_rep') }}"
    finsc_ld_cmp: "{{ source('sap', 'finsc_ld_cmp') }}"
    kna1: "{{ source('sap','kna1') }}"
    lfa1: "{{ source('sap', 'lfa1') }}"
    makt: "{{ source('sap', 'makt') }}"
    mara: "{{ source('sap', 'mara') }}"
    marc: "{{ source('sap', 'marc') }}"
    matdoc: "{{ source('sap', 'matdoc') }}"
    matdoc_extract: "{{ source('sap', 'matdoc_extract') }}"
    mchb: "{{ source('sap', 'mchb') }}"
    mchp: "{{ source('sap', 'mchp') }}"
    pa0000: "{{ source('sap', 'pa0000') }}"
    pa0001: "{{ source('sap', 'pa0001') }}"
    pa0007: "{{ source('sap', 'pa0007') }}"
    pa0008: "{{ source('sap', 'pa0008') }}"
    pa0031: "{{ source('sap', 'pa0031') }}"
    prps: "{{ source('sap', 'prps') }}"
    ska1: "{{ source('sap', 'ska1') }}"
    t000: "{{ source('sap', 't000') }}"
    t001: "{{ source('sap', 't001') }}"
    t001w: "{{ source('sap', 't001w') }}"
    t024: "{{ source('sap', 't024') }}"
    t024e: "{{ source('sap', 't024e') }}"
    t134: "{{ source('sap', 't134') }}"
    t134t: "{{ source('sap', 't134t') }}"
    t161: "{{ source('sap', 't161') }}"
    t161t: "{{ source('sap', 't161t') }}"
    t503: "{{ source('sap', 't503') }}"
    t880: "{{ source('sap', 't880') }}"
    tj01: "{{ source('sap', 'tj01') }}"
    tka01: "{{ source('sap', 'tka01') }}"
    t006: "{{ source('sap', 't006') }}"
    cosp_bak: "{{ source('sap', 'cosp_bak') }}"
    tvag: "{{ source('sap', 'tvag') }}"
    tvagt: "{{ source('sap', 'tvagt') }}"
    vbak: "{{ source('sap', 'vbak') }}"
    vbap: "{{ source('sap', 'vbap') }}"
